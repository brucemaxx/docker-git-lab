services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-aula
    restart: unless-stopped
    environment:
      POSTGRES_DB: auladb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aula-rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auladb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-aula
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aula-rede

networks:
  aula-rede:
    name: docker-git-lab-rede
    driver: bridge

volumes:
  postgres_data:
